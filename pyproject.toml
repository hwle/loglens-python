[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens-omar"
version = "0.1.0"
description = "Offline authentication event triage with explainable rules"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
loglens = "loglens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
